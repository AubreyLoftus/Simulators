<html lang="en">
<head>

<title>Ms. Loftus' Simulators</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f5f1;

  main {
    max-width: 960px;

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {

    background: #ffffff;
    border: 1px solid #dddbd3;
    border-radius: 14px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: #185fa5; transform: translateY(-2px); }
  .tag {
    display: inline-block;
    font-size: 0.8rem;
    background: #e6f1fb;
    color: #0c447c;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .card h2 { font-size: 1.2rem; margin: 0 0 6px; }
  .card p { margin: 0; color: #5f5e5a; font-size: 0.95rem; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Ms. Loftus' Simulators</h1>
  <p class="brand">Making Thinklings</p>

    </a>

</html>
